<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sample photo of a campus bulletin board notice">
  <rect width="400" height="300" fill="#8d6e4f"/>
  <rect x="12" y="12" width="376" height="276" fill="#b98f62"/>
  <g opacity=".5" fill="#a07a50"><circle cx="40" cy="40" r="3"/><circle cx="350" cy="260" r="3"/><circle cx="60" cy="250" r="2"/></g>
  <rect x="300" y="30" width="70" height="80" fill="#FFEFA2" transform="rotate(6 335 70)"/>
  <rect x="70" y="36" width="230" height="230" fill="#fff" transform="rotate(-2 185 150)"/>
  <circle cx="185" cy="44" r="7" fill="#E53935"/>
  <g transform="rotate(-2 185 150)" font-family="Arial,sans-serif">
    <text x="185" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#1B5E20">NOTICE</text>
    <text x="185" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#111411">ADDING / DROPPING</text>
    <text x="185" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#111411">OF SUBJECTS</text>
    <g fill="#B9C2BB"><rect x="90" y="140" width="190" height="7"/><rect x="90" y="156" width="170" height="7"/><rect x="90" y="172" width="185" height="7"/><rect x="90" y="188" width="140" height="7"/></g>
    <text x="185" y="225" text-anchor="middle" font-size="11" fill="#E53935" font-weight="700">DEADLINE: 2ND WEEK OF CLASSES</text>
    <text x="185" y="248" text-anchor="middle" font-size="9" fill="#6A746D">Office of the University Registrar</text>
  </g>
</svg>
